name: Check OpenAlex and publish Pages

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: pages-openalex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check the count and render the page
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python3 scripts/update_site.py --check-openalex
      - name: Stage public site files
        run: |
          mkdir _site
          cp -R index.html site.css site.js assets pnas_cyclone_editor_credits.csv _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish the checked site
        id: deploy
        uses: actions/deploy-pages@v5
